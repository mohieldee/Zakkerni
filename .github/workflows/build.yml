name: Build Zakkerni APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "Zakkerni_Android_Project.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Inspect and extract ZIP
        run: |
          set -e
          echo "=== ZIP CONTENTS ==="
          unzip -Z1 Zakkerni_Android_Project.zip | head -200

          mkdir -p project
          unzip -oq Zakkerni_Android_Project.zip -d project

          echo "=== BUILD FILES ==="
          find project -type f \( \
            -name gradlew -o \
            -name settings.gradle -o \
            -name settings.gradle.kts -o \
            -name build.gradle -o \
            -name build.gradle.kts \
          \) -print

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          set -e

          WRAPPER=$(find project -type f -name gradlew -print -quit)

          if [ -n "$WRAPPER" ]; then
            DIR=$(dirname "$WRAPPER")
          else
            DIR=$(find project -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$DIR" ] || [ ! -d "$DIR" ]; then
            echo "ERROR: Android project root not found."
            echo "Inspect the ZIP CONTENTS above."
            exit 1
          fi

          echo "Project root: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: .
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.dir }}
        run: |
          set -e
          cd "$PROJECT_DIR"

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "ERROR: Gradle wrapper is missing."
            echo "A complete Android project with a Gradle build is required."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Zakkerni-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
