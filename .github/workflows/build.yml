name: Build Zakkerni APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "Zakkerni_Android_Project.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Extract project
        run: |
          mkdir project
          unzip -q Zakkerni_Android_Project.zip -d project
          find project -maxdepth 4 -type f | head -100

      - name: Locate Gradle wrapper
        run: |
          find project -type f -name gradlew -print

      - name: Build APK
        run: |
          WRAPPER=$(find project -type f -name gradlew | head -1)
          if [ -z "$WRAPPER" ]; then
            echo "ERROR: Gradle wrapper not found"
            exit 1
          fi
          DIR=$(dirname "$WRAPPER")
          cd "$DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zakkerni-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
