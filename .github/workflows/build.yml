
name: Build Zakkerni APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "Zakkerni_Android_Project.zip"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q Zakkerni_Android_Project.zip -d project
          find project -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          cd project
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found at project root"
            find . -name gradlew -type f
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zakkerni-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
          
