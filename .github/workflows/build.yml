name: Build Zakkerni APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4

  - name: Set up Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Check project files
    run: |
      set -e
      echo "Checking repository files..."
      find . -maxdepth 3 -type f | sort | head -200
      echo "Checking for Gradle wrapper..."
      if [ -f "./gradlew" ]; then
        echo "Gradle wrapper found in repository root."
      elif [ -f "./Zakkerni_Android_Project/gradlew" ]; then
        echo "Gradle wrapper found in Android project folder."
      else
        echo "ERROR: No Gradle wrapper found. The Android project must be created or supplied."
        exit 1
      fi
